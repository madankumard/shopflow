name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the run it replaces.
# Runs on main are never cancelled: they may be part-way through a deployment.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: ghcr.io/madankumard

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # Unit tests plus integration tests; Testcontainers starts Postgres on the runner's Docker.
      - name: Run tests
        run: ./mvnw -B test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build

  config-server:
    name: Config server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  # Builds the images on every run. On main it also publishes them, tagged with the commit,
  # so every environment runs exactly the same image.
  images:
    name: Container images build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for app in backend frontend config-server; do
            docker build \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --build-arg "APP_VERSION=$TAG" \
              -t "$IMAGE_REPOSITORY/shopflow-$app:$TAG" "$app"
          done

      - name: Publish images
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The registry occasionally refuses a push, seen when a package is first created; retry.
          for app in backend frontend config-server; do
            for attempt in 1 2 3; do
              docker push "$IMAGE_REPOSITORY/shopflow-$app:$TAG" && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 10
            done
          done

  # Deployment. It runs only for commits on main, on the self-hosted runner, because the
  # dev environment is a kind cluster on that machine.
  #
  # Only dev is deployed at the moment. The qa, preprod and prod clusters were removed to
  # free disk space; their definitions are still in infra/kind and infra/k8s/overlays.
  # To bring one back, see "Adding an environment back" in CLAUDE.md.
  deploy-dev:
    name: Deploy to dev
    if: github.event_name == 'push'
    needs: [backend, frontend, config-server, images]
    runs-on: [self-hosted, shopflow-local]
    environment:
      name: dev
      url: http://localhost:8081
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        shell: powershell
        run: .\infra\deploy.ps1 -Environment dev -Tag ${{ needs.images.outputs.tag }}
      - name: Smoke test
        shell: powershell
        run: .\infra\smoke-test.ps1 -Environment dev -Tag ${{ needs.images.outputs.tag }}

  # A real browser logs in as each test user and takes an order from placed to delivered.
  e2e-dev:
    name: Browser tests on dev
    needs: [deploy-dev]
    runs-on: [self-hosted, shopflow-local]
    steps:
      - uses: actions/checkout@v7
      - name: Install Playwright
        shell: powershell
        working-directory: e2e
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Downloads the browser the first time only; later runs find it already installed.
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Run browser tests
        shell: powershell
        run: .\infra\e2e-test.ps1 -Environment dev
      - name: Upload the report, with a trace and video of each failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: |
            e2e/playwright-report
            e2e/test-results
