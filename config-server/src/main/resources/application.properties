spring.application.name=config-server
server.port=8888

# Where the settings live. Every request re-reads the repository, so a pushed change
# is served straight away; clients pick it up the next time they start.
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/madankumard/shopflow-config}
spring.cloud.config.server.git.default-label=${CONFIG_GIT_BRANCH:main}

management.endpoints.web.exposure.include=health,info
# Lets Kubernetes probe /actuator/health/liveness and /readiness without calling Git each time.
management.endpoint.health.probes.enabled=true