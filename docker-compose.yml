# Local development stack.
#   docker compose up -d db        -> database only (run backend/frontend from your IDE)
#   docker compose up -d --build   -> database + backend in containers
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow -d shopflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/shopflow
      DB_USERNAME: shopflow
      DB_PASSWORD: shopflow
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db-data:
