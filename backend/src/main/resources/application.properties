spring.application.name=backend

# Every environment-specific value comes from outside the image.
# In a cluster, ordinary settings come from the Config Server and secrets from Vault;
# both override anything in this file. The defaults below suit local development,
# where neither is running.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopflow}
spring.datasource.username=${DB_USERNAME:shopflow}
spring.datasource.password=${DB_PASSWORD:shopflow}

# Served by the Config Server from the shopflow-config repo (backend-<profile>.yml).
app.environment=local
app.banner=
# A product with this many or fewer in stock is listed as low on the reports page.
app.reports.low-stock-threshold=10
# The commit the image was built from, set when the image is built.
app.version=${APP_VERSION:dev}

# Config Server and Vault are off unless the environment switches them on. A cluster
# also sets SPRING_CONFIG_IMPORT=configserver:<url>,vault:// to say where they are.
spring.cloud.config.enabled=${CONFIG_SERVER_ENABLED:false}
spring.cloud.config.fail-fast=true
spring.cloud.vault.enabled=${VAULT_ENABLED:false}
spring.cloud.vault.fail-fast=true
spring.cloud.vault.uri=${VAULT_URI:http://localhost:8200}
# The pod proves who it is with its Kubernetes service account; no Vault password is stored.
spring.cloud.vault.authentication=KUBERNETES
spring.cloud.vault.kubernetes.role=backend

# Login tokens are issued by Keycloak. The keys to check their signature are fetched from
# Keycloak directly; the issuer is the address users see, which differs per environment
# and is set in the shopflow-config repo.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URL:http://localhost:8180/auth/realms/shopflow/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:4200/auth/realms/shopflow

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
