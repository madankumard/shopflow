spring.application.name=backend

# Every environment-specific value comes from outside the image.
# The defaults suit local development; later milestones move these to Config Server and Vault.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopflow}
spring.datasource.username=${DB_USERNAME:shopflow}
spring.datasource.password=${DB_PASSWORD:shopflow}

# The environment name is set per cluster (infra/k8s/overlays); the version is the
# commit the image was built from, set when the image is built.
app.environment=${APP_ENVIRONMENT:local}
app.version=${APP_VERSION:dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
