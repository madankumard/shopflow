<header class="app-header">
  <h1>ShopFlow</h1>
  <nav>
    <a routerLink="/products" routerLinkActive="active">Products</a>
  </nav>
  @if (info(); as info) {
    <span class="env-badge" [attr.data-env]="info.environment">
      {{ info.environment }} · {{ info.version }}
    </span>
  }
  <!-- Empty until Keycloak has said whether the visitor is already logged in. -->
  <div class="auth">
    @if (auth.status() === 'ready') {
      @if (auth.user(); as user) {
        <span class="user">
          {{ user.username }}
          @if (user.roles.length > 0) {
            <span class="roles">({{ user.roles.join(', ') }})</span>
          }
        </span>
        <button type="button" class="logout" (click)="auth.logout()">Log out</button>
      } @else {
        <button type="button" class="login" (click)="auth.login()">Log in</button>
      }
    }
  </div>
</header>

@if (info()?.banner; as banner) {
  <p class="env-banner" role="status">{{ banner }}</p>
}

<main class="app-main">
  <router-outlet />
</main>
