# The port the browser used, taken from its Host header: "127.0.0.1:8081" gives ":8081".
# Used to send other spellings of this machine's address to localhost on the same port.
map $http_host $browser_port {
    "~:(?<port>[0-9]+)$" ":$port";
    default "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # For Kubernetes' readiness probe, which calls by the pod's IP address. It is answered
    # here so the probe is not caught by the redirect to localhost below.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API calls go to the backend; BACKEND_URL is set per environment.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login pages and token calls go to Keycloak, so the app and its login share one address.
    # Keycloak builds links from these headers, so they carry the host and port the browser used.
    location /auth/ {
        proxy_pass ${KEYCLOAK_URL};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keycloak's responses carry large headers (cookies).
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
    }

    # Angular handles all other routes in the browser.
    location / {
        # One address only. Keycloak and the backend know this app as "localhost", and login
        # only works there, so a page opened by any other address (127.0.0.1, a hostname, a
        # network IP) is sent to the same page on localhost. This applies to page loads only;
        # API and login calls above are never redirected, so a POST is never turned into a GET.
        if ($host != "localhost") {
            return 302 $scheme://localhost$browser_port$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }
}
