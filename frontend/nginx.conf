server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend; BACKEND_URL is set per environment.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login pages and token calls go to Keycloak, so the app and its login share one address.
    # Keycloak builds links from these headers, so they carry the host and port the browser used.
    location /auth/ {
        proxy_pass ${KEYCLOAK_URL};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keycloak's responses carry large headers (cookies).
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
    }

    # Angular handles all other routes in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
