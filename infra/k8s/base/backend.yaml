# The identity the backend presents to Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      containers:
        - name: backend
          # The tag is set at deploy time by infra/deploy.ps1.
          image: ghcr.io/madankumard/shopflow-backend
          ports:
            - containerPort: 8080
          # Sets SPRING_PROFILES_ACTIVE, which decides which settings file the Config Server returns.
          envFrom:
            - configMapRef:
                name: shopflow-env
          env:
            - name: DB_URL
              value: jdbc:postgresql://db:5432/shopflow
            # Ordinary settings come from the Config Server, the database credentials from Vault.
            # The backend holds no password: if either is unreachable it refuses to start.
            - name: CONFIG_SERVER_ENABLED
              value: "true"
            - name: VAULT_ENABLED
              value: "true"
            - name: VAULT_URI
              value: http://vault:8200
            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-server:8888,vault://
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=60
          # Gives the JVM up to two minutes to start before the other probes apply.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
