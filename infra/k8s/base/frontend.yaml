apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      # Published on the host by the kind cluster config (infra/kind/<env>.yaml).
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # The tag is set at deploy time by infra/deploy.ps1.
          image: ghcr.io/madankumard/shopflow-frontend
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: http://backend:8080
            - name: KEYCLOAK_URL
              value: http://keycloak:8080
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
