# Keycloak: the login server. Runs in development mode with its own in-memory database,
# so a restart forgets sessions and any users added by hand; the realm in
# keycloak/shopflow-realm.json (roles, the web client, three test users) is loaded again
# on every start. Browsers reach it through the frontend's nginx at <environment URL>/auth.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  # Two copies would each hold their own users and sessions.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          args: ["start-dev", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            # Served under /auth, behind the frontend's nginx, on whatever address the browser used.
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Generated per cluster by the infra scripts; see infra/show-logins.ps1.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-keycloak
                  key: admin-password
            # Substituted into the realm file as the test users' password.
            - name: SHOPFLOW_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-keycloak
                  key: user-password
          # Development mode rebuilds itself on start, which can take a couple of minutes.
          startupProbe:
            httpGet:
              path: /auth/health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /auth/health/live
              port: management
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
