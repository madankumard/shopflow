# Everything the environments have in common. Each overlay in ../overlays changes only what differs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopflow

resources:
  - namespace.yaml
  - postgres.yaml
  - vault.yaml
  - config-server.yaml
  - keycloak.yaml
  - backend.yaml
  - frontend.yaml

configMapGenerator:
  # The one setting that stays in the cluster: which environment this is. Overlays set it.
  # Everything else comes from the shopflow-config repo through the Config Server.
  - name: shopflow-env
    literals:
      - SPRING_PROFILES_ACTIVE=local
  - name: keycloak-realm
    files:
      - keycloak/shopflow-realm.json
  - name: vault-seed
    files:
      - vault/seed.sh
      - vault/backend-policy.hcl
