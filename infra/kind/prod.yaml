# kind cluster standing in for the prod server.
# The frontend's NodePort (30080) is published on http://localhost:8084.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shopflow-prod
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8084
        listenAddress: 127.0.0.1
        protocol: TCP
