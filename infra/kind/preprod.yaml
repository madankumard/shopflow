# kind cluster standing in for the preprod server.
# The frontend's NodePort (30080) is published on http://localhost:8083.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shopflow-preprod
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8083
        listenAddress: 127.0.0.1
        protocol: TCP
