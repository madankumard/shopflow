# kind cluster standing in for the qa server.
# The frontend's NodePort (30080) is published on http://localhost:8082.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shopflow-qa
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8082
        listenAddress: 127.0.0.1
        protocol: TCP
